<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dory</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f3ed;
      --ink: #26251e;
      --muted: #6f6b63;
      --soft: #ece9df;
      --line: rgba(23, 22, 21, 0.12);
      --blue: #2f6cff;
      --hero-light: rgba(49, 114, 255, 0.12);
      --hero-wash: rgba(255, 255, 255, 0.52);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #171615;
        --ink: #f7f7f4;
        --muted: #b4b0a6;
        --soft: #26241e;
        --line: rgba(247, 247, 244, 0.13);
        --blue: #78a7ff;
        --hero-light: rgba(59, 130, 246, 0.14);
        --hero-wash: rgba(255, 255, 255, 0.04);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 320px;
      padding: 32px;
    }

    body::before {
      position: fixed;
      top: 0;
      right: -24%;
      left: -24%;
      height: 420px;
      background:
        radial-gradient(circle at 50% 0%, var(--hero-light), transparent 36%),
        linear-gradient(to bottom, var(--hero-wash), transparent 62%);
      content: "";
      pointer-events: none;
    }

    body::after {
      position: fixed;
      inset: auto 0 0;
      height: 38%;
      background:
        linear-gradient(to bottom, transparent, color-mix(in oklab, var(--page) 94%, white 6%)),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 46px 46px, 46px 46px;
      opacity: 0.34;
      content: "";
      pointer-events: none;
    }

    .loading {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      width: min(360px, 100%);
      text-align: center;
      animation: enter 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 116px;
      height: 116px;
      margin-bottom: 22px;
      border: 1px solid color-mix(in oklab, var(--ink) 8%, transparent);
      border-radius: 28px;
      background: color-mix(in oklab, var(--soft) 72%, transparent);
      box-shadow:
        0 18px 42px rgba(23, 22, 21, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .logo-wrap::before {
      position: absolute;
      inset: -14px;
      border-radius: 36px;
      background: radial-gradient(circle, color-mix(in oklab, var(--blue) 20%, transparent), transparent 62%);
      content: "";
      opacity: 0.72;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .logo {
      position: relative;
      display: block;
      width: 72px;
      height: 72px;
      object-fit: contain;
      animation: hover 2.8s ease-in-out infinite;
    }

    .brand {
      margin: 0;
      color: var(--ink);
      font-size: 34px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--blue);
      box-shadow: 0 0 0 0 color-mix(in oklab, var(--blue) 34%, transparent);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .progress {
      position: relative;
      width: 164px;
      height: 3px;
      margin-top: 26px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in oklab, var(--muted) 18%, transparent);
    }

    .progress::after {
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      content: "";
      animation: progress 1.28s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(7px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.48;
        transform: scale(0.96);
      }

      50% {
        opacity: 0.84;
        transform: scale(1.04);
      }
    }

    @keyframes hover {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 color-mix(in oklab, var(--blue) 30%, transparent);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 0 8px transparent;
        transform: scale(0.92);
      }
    }

    @keyframes progress {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(270%);
      }
    }

    @media (max-height: 420px), (max-width: 420px) {
      body {
        padding: 24px;
      }

      .logo-wrap {
        width: 96px;
        height: 96px;
        margin-bottom: 18px;
        border-radius: 24px;
      }

      .logo {
        width: 60px;
        height: 60px;
      }

      .brand {
        font-size: 30px;
      }

      .progress {
        margin-top: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading,
      .logo-wrap::before,
      .logo,
      .pulse,
      .progress::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="loading" aria-label="Dory is starting">
    <div class="logo-wrap" aria-hidden="true">
      <img id="logoImg" class="logo" src="./logo.png" alt="" />
    </div>
    <h1 class="brand">Dory</h1>
    <div class="status" role="status" aria-live="polite">
      <span class="pulse" aria-hidden="true"></span>
      <span>Starting workspace</span>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </main>
  <script>
    const logoImg = document.getElementById('logoImg');
    const logoFallbacks = ['../../../public/logo.png', '../../web/public/logo.png'];
    let logoFallbackIndex = 0;

    logoImg.addEventListener('error', () => {
      if (logoFallbackIndex >= logoFallbacks.length) return;
      logoImg.src = logoFallbacks[logoFallbackIndex];
      logoFallbackIndex += 1;
    });
  </script>
</body>
</html>
