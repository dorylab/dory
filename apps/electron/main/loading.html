<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dory</title>
  <style>
    :root {
      color-scheme: light;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --muted: oklch(0.556 0 0);
      --muted-surface: oklch(0.97 0 0);
      --text: var(--foreground);
      --surface: var(--background);
      --wash: rgba(255, 255, 255, 0.46);
      --fade: linear-gradient(to bottom, transparent 0%, color-mix(in oklab, var(--background) 62%, transparent) 58%, var(--background) 100%);
      --white: #ffffff;
      --black: #000000;
      --transparent: transparent;
      --blue-300: #93c5fd;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --indigo-300: #a5b4fc;
      --violet-200: #ddd6fe;
      --aurora-opacity: 0.28;
      --aurora-blend-mode: normal;
      --aurora-filter: blur(18px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --muted: oklch(0.708 0 0);
        --muted-surface: oklch(0.269 0 0);
        --text: var(--foreground);
        --surface: var(--background);
        --wash: color-mix(in oklab, var(--background) 28%, transparent);
        --fade: linear-gradient(to bottom, transparent 0%, color-mix(in oklab, var(--background) 50%, transparent) 58%, var(--background) 100%);
        --aurora-opacity: 0.42;
        --aurora-blend-mode: difference;
        --aurora-filter: blur(10px);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--surface);
    }

    body {
      display: grid;
      place-items: center;
    }

    .aurora {
      position: fixed;
      inset: -10px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora::before,
    .aurora::after {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(100deg, var(--white) 0%, var(--white) 7%, var(--transparent) 10%, var(--transparent) 12%, var(--white) 16%),
        repeating-linear-gradient(100deg, var(--blue-500) 10%, var(--indigo-300) 15%, var(--blue-300) 20%, var(--violet-200) 25%, var(--blue-400) 30%);
      background-position: 62% 18%, 62% 18%;
      background-size: 300%, 200%;
      content: "";
      filter: var(--aurora-filter);
      mask-image: radial-gradient(ellipse at 100% 0%, black 10%, var(--transparent) 70%);
      opacity: var(--aurora-opacity);
      will-change: background-position;
    }

    .aurora::after {
      background-size: 200%, 100%;
      mix-blend-mode: var(--aurora-blend-mode);
      animation: aurora 60s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      .aurora::before,
      .aurora::after {
        background-image:
          repeating-linear-gradient(100deg, var(--black) 0%, var(--black) 7%, var(--transparent) 10%, var(--transparent) 12%, var(--black) 16%),
          repeating-linear-gradient(100deg, var(--blue-500) 10%, var(--indigo-300) 15%, var(--blue-300) 20%, var(--violet-200) 25%, var(--blue-400) 30%);
        filter: var(--aurora-filter);
      }
    }

    .wash {
      position: fixed;
      z-index: 1;
      inset: 0;
      background: var(--wash);
      pointer-events: none;
    }

    .fade {
      position: fixed;
      z-index: 1;
      inset: auto 0 0;
      height: 50%;
      background: var(--fade);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      width: min(28rem, calc(100vw - 72px));
      text-align: center;
      animation: rise 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-size: 32px;
      font-weight: 650;
      line-height: 1.1;
      letter-spacing: 0;
      color: var(--text);
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .progress {
      position: relative;
      width: min(18rem, 100%);
      height: 4px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in oklab, var(--muted-surface) 80%, transparent);
    }

    .progress::after {
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--blue-500), #2dd4bf);
      content: "";
      animation: progress 1.35s ease-in-out infinite;
    }

    @keyframes aurora {
      from {
        background-position: 50% 50%, 50% 50%;
      }

      to {
        background-position: 350% 50%, 350% 50%;
      }
    }

    @keyframes progress {
      0% { transform: translateX(-90%); }
      100% { transform: translateX(265%); }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>
  <main class="content" aria-label="Dory is starting">
    <div class="brand">Dory</div>
    <div class="status">Starting your workspace...</div>
    <div class="progress" aria-hidden="true"></div>
  </main>
  <div class="fade" aria-hidden="true"></div>
</body>
</html>
